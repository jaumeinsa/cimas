# Cimas — despliegue en el VPS.
#   cp .env.example .env   (y rellena ANTHROPIC_API_KEY si quieres la IA)
#   docker compose up -d --build
#
# La web queda en 127.0.0.1:3010 (puerto poco habitual para no chocar con
# otros servicios del mismo VPS). Pon Nginx/Certbot delante para HTTPS: ver
# scripts/deploy-vps.sh.

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3010:3000"
