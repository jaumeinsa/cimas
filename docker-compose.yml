# Rutakon — despliegue en el VPS.
#   cp .env.example .env   (y rellena ANTHROPIC_API_KEY si quieres la IA)
#   docker compose up -d --build
#
# La web queda en 127.0.0.1:3987 (puerto raro a propósito: el VPS aloja
# varios servicios y el 3010 ya estaba ocupado). Pon Nginx/Certbot delante para HTTPS: ver
# scripts/deploy-vps.sh.

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3987:3000"
